# Все значения можно переопределить из командной строки: mvn test -Dapp.jar=/path/to/app.jar

# Адрес тестируемого приложения
app.url=http://localhost:8080
# Значение заголовка X-Api-Key (то же, что -Dsecret при запуске приложения)
app.secret=qazWSXedc
# Путь к jar-файлу приложения
app.jar=app/internal-0.0.1-SNAPSHOT.jar
# true  - тесты сами запускают и останавливают приложение
# false - приложение уже запущено вручную (с теми же -Dsecret и -Dmock)
app.start=true
app.startup-timeout-seconds=60

# Порт, на котором поднимается WireMock (имитация внешнего сервиса)
mock.port=8888

# Таймаут клиента тестов (должен быть больше таймаута приложения на внешний вызов, ~10 с)
client.timeout-seconds=40
